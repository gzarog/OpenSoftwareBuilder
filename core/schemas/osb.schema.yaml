# JSON Schema for osb.yaml project configuration (expressed as YAML for readability)
# Validate with: osb doctor

type: object
required: [version]
additionalProperties: false

properties:
  version:
    type: integer
    enum: [1, 2]

  mode:
    type: string
    enum: [full, light]
    default: full
    description: |
      Operating mode.
      full  — RagMonk is mandatory; all knowledge discovery goes through it.
      light — RagMonk is optional; direct file access is permitted.

  intelligence:
    type: object
    additionalProperties: false
    description: Project intelligence provider configuration
    properties:
      provider:
        type: string
        enum: [ragmonk]
        default: ragmonk
      ragmonk:
        type: object
        additionalProperties: false
        properties:
          executable:
            type: string
            default: ragmonk
            description: RagMonk binary name or absolute path
          source:
            type: string
            default: project
            description: RagMonk source name for this repository
          require_healthy_index:
            type: boolean
            default: true
          auto_index:
            type: boolean
            default: true
            description: Trigger incremental index before retrieval when source is dirty
          auto_watch:
            type: boolean
            default: true
            description: Start ragmonk watch daemon if not already running
          transport:
            type: string
            enum: [cli, mcp]
            default: cli
            description: How OSB communicates with RagMonk
          retrieval:
            type: object
            additionalProperties: false
            properties:
              command:
                type: string
                default: explore
              max_results:
                type: integer
                default: 20
              include_code:
                type: boolean
                default: true
              include_tests:
                type: boolean
                default: true
              include_docs:
                type: boolean
                default: true
              include_osb_knowledge:
                type: boolean
                default: true
          active_task_knowledge:
            type: boolean
            default: true
            description: |
              When true, incremental knowledge events captured during an active task
              are indexed and retrievable by RagMonk for later agents in the same task.
              Requires Full Mode.
          refresh_on_checkpoint:
            type: boolean
            default: true
            description: |
              When true, trigger a RagMonk incremental index after each knowledge
              capture event so subsequent agents immediately benefit from new discoveries.

  paths:
    type: object
    additionalProperties: false
    properties:
      source:
        type: array
        items: { type: string }
        description: Directories containing project source code
        default: [src]
      generated:
        type: array
        items: { type: string }
        description: Directories to exclude from change detection (build output, deps)
        default: [bin, obj, node_modules, dist, build, .next, out, coverage]
      checkpoints:
        type: string
        description: Directory for agent checkpoint files
        default: .osb/progress
      knowledge:
        type: string
        description: Directory for durable knowledge records (tasks/ and components/)
        default: .osb/knowledge
      specs:
        type: string
        description: Directory for architecture specifications (indexed by RagMonk in full mode)
        default: .osb/specs
      reviews:
        type: string
        description: Directory for review findings (indexed by RagMonk in full mode)
        default: .osb/reviews
      qa:
        type: string
        description: Directory for QA evidence (indexed by RagMonk in full mode)
        default: .osb/qa
      decisions:
        type: string
        description: Directory for architecture decisions (indexed by RagMonk in full mode)
        default: .osb/decisions
      state:
        type: string
        description: Directory for gate state markers
        default: .osb/state

  commands:
    type: object
    additionalProperties: false
    properties:
      build:
        type: [string, 'null']
        description: Build command run from project root
      test:
        type: [string, 'null']
        description: Test command run from project root
      fitness:
        type: [string, 'null']
        description: Architecture fitness test command
      e2e:
        type: [string, 'null']
        description: End-to-end test command
      changed:
        type: [string, 'null']
        description: Custom change-detection command (default uses git or mtime)

  capabilities:
    type: object
    additionalProperties: false
    properties:
      structural_explorer:
        type: [string, 'null']
        enum: [codegraph, lsp, null]
        description: Preferred structural code explorer
      browser_qa:
        type: string
        enum: [required, optional, none]
        default: optional
        description: Whether browser-based QA is required for UI components

  policy:
    type: object
    additionalProperties: false
    properties:
      require_independent_review:
        type: boolean
        default: true
      require_fresh_qa:
        type: boolean
        default: true
      sensitive_areas:
        type: array
        items: { type: string }
        default: [auth, payments, external-input]
        description: Areas requiring individual review (not batched)

  profile:
    type: string
    description: Named profile from profiles/ to inherit defaults from
