version: 2
builds:
  - main: ./cmd/osb
    binary: osb
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X github.com/gzarog/opensoftwarebuilder/internal/cli.Version={{.Version}}

archives:
  - format: tar.gz
    name_template: "osb_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
