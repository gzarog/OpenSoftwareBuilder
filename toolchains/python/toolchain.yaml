id: python
name: "Python"
detect:
  files: ["pyproject.toml", "requirements.txt", "setup.py", "Pipfile"]
source_extensions: [.py, .pyi]
generated: [__pycache__, .venv, venv, dist, build, .pytest_cache, .mypy_cache]
requires:
  - executable: python3
commands:
  restore: { argv: [pip, install, -r, requirements.txt] }
  build: { argv: [python3, -m, build] }
  test: { argv: [python3, -m, pytest] }
  lint: { argv: [ruff, check, .] }
  format: { argv: [ruff, format, .] }
analysis:
  lsp: pyright
  tree_sitter: python
