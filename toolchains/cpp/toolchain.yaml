id: cpp
name: "C/C++"
detect:
  files: ["CMakeLists.txt", "meson.build", "Makefile"]
source_extensions: [.c, .cpp, .cc, .h, .hpp]
generated: [build, cmake-build-debug]
requires:
  - executable: gcc
commands:
  restore: { argv: [cmake, -S, ., -B, build] }
  build: { argv: [cmake, --build, build] }
  test: { argv: [ctest, --test-dir, build] }
  lint: { argv: [clang-tidy, --quiet] }
  format: { argv: [clang-format, -i] }
analysis:
  lsp: clangd
  tree_sitter: cpp
