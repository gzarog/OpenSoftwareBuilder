id: java
name: "Java"
detect:
  files: ["pom.xml", "build.gradle", "build.gradle.kts"]
source_extensions: [.java]
generated: [target, build, .gradle, out]
requires:
  - executable: java
commands:
  restore: { argv: [mvn, dependency:resolve] }
  build: { argv: [mvn, compile] }
  test: { argv: [mvn, test] }
  lint: { argv: [mvn, checkstyle:check] }
  format: { argv: [mvn, spotless:apply] }
analysis:
  lsp: jdtls
  tree_sitter: java
