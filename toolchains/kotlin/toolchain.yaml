id: kotlin
name: "Kotlin"
detect:
  files: ["build.gradle.kts"]
source_extensions: [.kt, .kts]
generated: [build, .gradle, out]
requires:
  - executable: kotlin
commands:
  restore: { argv: [gradle, dependencies] }
  build: { argv: [gradle, build] }
  test: { argv: [gradle, test] }
  lint: { argv: [ktlint, --reporter=plain] }
  format: { argv: [ktlint, --format] }
analysis:
  lsp: kotlin-language-server
  tree_sitter: kotlin
