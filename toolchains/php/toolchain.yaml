id: php
name: "PHP"
detect:
  files: ["composer.json"]
source_extensions: [.php]
generated: [vendor]
requires:
  - executable: php
commands:
  restore: { argv: [composer, install] }
  build: { argv: [composer, run, build] }
  test: { argv: [./vendor/bin/phpunit] }
  lint: { argv: [./vendor/bin/phpstan, analyse] }
  format: { argv: [./vendor/bin/php-cs-fixer, fix] }
analysis:
  lsp: phpactor
  tree_sitter: php
