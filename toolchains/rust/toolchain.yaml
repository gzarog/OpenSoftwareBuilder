id: rust
name: "Rust"
detect:
  files: ["Cargo.toml"]
source_extensions: [.rs]
generated: [target]
requires:
  - executable: cargo
commands:
  restore: { argv: [cargo, fetch] }
  build: { argv: [cargo, build] }
  test: { argv: [cargo, test] }
  lint: { argv: [cargo, clippy] }
  format: { argv: [cargo, fmt] }
analysis:
  lsp: rust-analyzer
  tree_sitter: rust
