id: node
name: "Node.js"
detect:
  files: ["package.json"]
source_extensions: [.js, .jsx, .ts, .tsx, .mjs, .cjs]
generated: [node_modules, dist, build, .next, out, coverage]
requires:
  - executable: node
commands:
  restore: { argv: [npm, install] }
  build: { argv: [npm, run, build] }
  test: { argv: [npm, test] }
  lint: { argv: [npx, eslint, .] }
  format: { argv: [npx, prettier, --write, .] }
analysis:
  lsp: typescript-language-server
  tree_sitter: typescript
