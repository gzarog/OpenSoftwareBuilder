name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate OSB package structure
        run: python osb/scripts/validate_osb.py
      - name: Run OSB unit/fixture tests
        run: python -m unittest discover -s osb/tests -p 'test_*.py' -v
