id: local
name: "Local"
type: executor
description: "Executes commands directly on the host machine"
isolation: none
requirements: []
capabilities:
  - direct_filesystem
  - host_network
  - environment_variables
  - path_resolution
configuration:
  shell:
    windows: [pwsh, -NoProfile, -Command]
    linux: [/bin/sh, -c]
    darwin: [/bin/sh, -c]
  working_directory: "."
  environment_inherit: true
