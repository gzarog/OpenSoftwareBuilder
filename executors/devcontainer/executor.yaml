id: devcontainer
name: "Dev Container"
type: executor
description: "Executes commands inside a Dev Container environment"
isolation: container
requirements:
  - executable: docker
  - file: .devcontainer/devcontainer.json
capabilities:
  - isolated_filesystem
  - volume_mounts
  - network_isolation
  - features
  - lifecycle_hooks
  - port_forwarding
  - extensions
configuration:
  config_file: ".devcontainer/devcontainer.json"
  build_on_start: true
  mount_workspace: true
  shutdown_action: "stopContainer"
