# OSB v2 configuration. Copy this file to the project root as `osb.yaml`.
version: 2

models:
  claude-code:
    architect:
    implementer:
    reviewer:
    qa:

  codex:
    architect:
    implementer:
    reviewer:
    qa:

  copilot:
    architect:
    implementer:
    reviewer:
    qa:

# Opt-in multi-repository orchestration (Phase 3). Omit this whole section for the
# default single-repo project. See osb/docs/MULTI_REPO.md.
# workspace:
#   mode: multi-repo        # default remains single-repo when this section is absent
#   root: .
#   repositories:
#     - id: contracts
#       path: shared-contracts
#     - id: identity
#       path: services/identity-api
#       depends_on: [contracts]
#     - id: payments
#       path: services/payment-api
#       depends_on: [contracts, identity]
#   integration_checks:
#     - name: api-contracts
#       command: ./scripts/check-contracts.sh
#       cwd: .

execution:
  max_parallel_implementers: 2
  compact_handoffs: true
  checkpoint_state: true
  delta_repairs: true
  # isolation: shared        # or: worktree (Phase 4) — default remains shared

knowledge:
  enabled: true
  incremental: true
  path: .osb/knowledge

ragmonk:
  enabled: true
  required: true
  retrieve_before_architecture: true
  refresh_after_knowledge_change: true
