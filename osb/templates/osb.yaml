# OSB v2 configuration. Copy this file to the project root as `osb.yaml`.
version: 2

models:
  claude-code:
    architect:
    implementer:
    reviewer:
    qa:

  codex:
    architect:
    implementer:
    reviewer:
    qa:

  copilot:
    architect:
    implementer:
    reviewer:
    qa:

# Opt-in multi-repository orchestration (Phase 3). Omit this whole section for the
# default single-repo project. See osb/docs/MULTI_REPO.md.
# workspace:
#   mode: multi-repo        # default remains single-repo when this section is absent
#   root: .
#   repositories:
#     - id: contracts
#       path: shared-contracts
#     - id: identity
#       path: services/identity-api
#       depends_on: [contracts]
#     - id: payments
#       path: services/payment-api
#       depends_on: [contracts, identity]
#   integration_checks:
#     - name: api-contracts
#       command: ./scripts/check-contracts.sh
#       cwd: .

execution:
  max_parallel_implementers: 2
  compact_handoffs: true
  checkpoint_state: true
  delta_repairs: true
  # isolation: shared        # or: worktree (Phase 4) — default remains shared
  # Opt-in bounded recovery/retry limits (Next Improvements, Phase 4). See
  # osb/docs/RECOVERY.md. Omit for the documented safe defaults.
  # max_repair_attempts_per_finding: 3
  # max_identical_failure_repeats: 2
  # max_context_expansions_per_question: 5

knowledge:
  enabled: true
  incremental: true
  path: .osb/knowledge

ragmonk:
  enabled: true
  required: true
  retrieve_before_architecture: true
  refresh_after_knowledge_change: true

# Opt-in repository discovery (Next Improvements, Phase 1). Omit to keep explicit-only
# multi-repo config (workspace.repositories above) or single-repo mode. See
# osb/docs/MULTI_REPO.md §Discovery.
# workspace:
#   discovery:
#     enabled: true
#     max_depth: 4
#     require_confirmation: true
#     exclude: [.osb, node_modules, .venv, bin, obj]

# Opt-in task-specific impact analysis and test selection (Next Improvements, Phase 2).
# See osb/docs/IMPACT_AND_TEST_SELECTION.md.
# impact:
#   enabled: true
#   max_depth: 3
#   include_tests: true

# Opt-in evidence-aware context broker (Next Improvements, Phase 3). See
# osb/docs/CONTEXT_BROKER.md.
# context:
#   broker_enabled: true
#   reuse_unchanged_sources: true
#   initial_max_chars: 6000

# Opt-in per-task execution reports (Next Improvements, Phase 5). See
# osb/docs/EXECUTION_REPORTS.md.
# reporting:
#   enabled: true
#   write_json: true
#   write_markdown: true
