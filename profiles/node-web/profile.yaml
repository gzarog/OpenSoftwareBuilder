# Node.js web profile — defaults for Node/TypeScript web projects

paths:
  source:
    - src
    - apps
    - packages
  generated:
    - node_modules
    - dist
    - build
    - .next
    - out
    - coverage

commands:
  build: npm run build
  test: npm test
  fitness: null
  e2e: null

capabilities:
  structural_explorer: codegraph
  browser_qa: required

policy:
  sensitive_areas:
    - auth
    - payments
    - external-input
