# Generic profile — minimal defaults suitable for any project
# Override in osb.yaml for your specific project.

paths:
  source:
    - src
  generated:
    - node_modules
    - dist
    - build
    - coverage
    - .next
    - out

commands:
  build: null
  test: null
  fitness: null
  e2e: null

capabilities:
  structural_explorer: null
  browser_qa: optional
